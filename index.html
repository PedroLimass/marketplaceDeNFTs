<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Kurio: marketplace de NFTs para colecionadores. Descubra arte digital, fotografia, música e muito mais, com compra simulada e carteiras de demonstração."
    />
    <meta name="theme-color" content="#140d0a" />
    <title>Kurio — Marketplace de NFTs</title>
    <style>
      html,
      body {
        margin: 0;
        background: #140d0a;
      }

      .boot {
        box-sizing: border-box;
        min-height: 100dvh;
        background: #140d0a;
        color: #f5f1eb;
        font:
          700 14px/1 ui-monospace,
          monospace;
      }

      .boot *,
      .boot *::before,
      .boot *::after {
        box-sizing: border-box;
      }

      .boot-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .boot-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        max-width: 1200px;
        min-width: 0;
        margin: 0 auto;
        padding: 24px 16px 16px;
        border-bottom: 1px solid #3f2319;
      }

      .boot-mark {
        flex-shrink: 0;
        letter-spacing: 1.4px;
      }

      .boot-nav,
      .boot-actions,
      .boot-line,
      .boot-cta,
      .boot-art {
        display: block;
        border-radius: 6px;
        background: linear-gradient(100deg, #241612 30%, #2f1d15 50%, #241612 70%);
        background-size: 200% 100%;
        animation: boot-shimmer 1.4s linear infinite;
      }

      .boot-nav {
        display: none;
        flex: 1 1 auto;
        min-width: 0;
        max-width: 280px;
        height: 16px;
      }

      .boot-actions {
        display: flex;
        flex-shrink: 0;
        gap: 8px;
        width: min(96px, 30vw);
        height: 36px;
        background: none;
        animation: none;
      }

      .boot-actions i {
        display: block;
        flex: 1 1 0;
        min-width: 0;
        border-radius: 6px;
        background: linear-gradient(100deg, #241612 30%, #2f1d15 50%, #241612 70%);
        background-size: 200% 100%;
        animation: boot-shimmer 1.4s linear infinite;
      }

      .boot-main {
        max-width: 1200px;
        min-width: 0;
        margin: 0 auto;
        padding: 40px 24px 32px;
      }

      .boot-hero {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-width: 0;
      }

      .boot-copy {
        display: flex;
        flex: 1 1 auto;
        min-width: 0;
        flex-direction: column;
        gap: 12px;
      }

      .boot-line {
        height: 12px;
        max-width: 100%;
      }

      .boot-line-sm {
        width: min(140px, 55%);
        height: 10px;
      }

      .boot-line-lg {
        width: min(420px, 100%);
        height: 18px;
      }

      .boot-line-md {
        width: min(280px, 80%);
      }

      .boot-cta {
        width: min(140px, 46%);
        height: 40px;
        margin-top: 8px;
      }

      .boot-art {
        flex: 0 0 auto;
        width: clamp(96px, 36vw, 138px);
        height: clamp(96px, 36vw, 138px);
        border-radius: 16px;
      }

      @media (min-width: 768px) {
        .boot-header {
          padding: 24px 32px 16px;
        }

        .boot-nav {
          display: block;
        }

        .boot-main {
          padding: 32px 32px 48px;
        }

        .boot-hero {
          min-height: clamp(300px, 36vw, 450px);
        }

        .boot-copy {
          max-width: 600px;
          gap: 16px;
        }

        .boot-line-lg {
          height: 28px;
        }

        .boot-art {
          width: min(450px, 42vw);
          height: min(450px, 42vw);
          border-radius: 24px;
        }
      }

      @media (min-width: 1280px) {
        .boot-header,
        .boot-main {
          padding-left: 0;
          padding-right: 0;
        }
      }

      @keyframes boot-shimmer {
        to {
          background-position: -200% 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-nav,
        .boot-line,
        .boot-cta,
        .boot-art,
        .boot-actions i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite" aria-busy="true">
        <p class="boot-sr">Carregando a Kurio</p>
        <header class="boot-header">
          <span class="boot-mark">KURIO</span>
          <span class="boot-nav" aria-hidden="true"></span>
          <span class="boot-actions" aria-hidden="true"><i></i><i></i></span>
        </header>
        <div class="boot-main">
          <section class="boot-hero" aria-hidden="true">
            <div class="boot-copy">
              <span class="boot-line boot-line-sm"></span>
              <span class="boot-line boot-line-lg"></span>
              <span class="boot-line boot-line-lg"></span>
              <span class="boot-line boot-line-md"></span>
              <span class="boot-cta"></span>
            </div>
            <span class="boot-art"></span>
          </section>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
